framework:
    messenger:
        failure_transport: failed

        # H1 (D-126) — CorrelationStamp propagation: every message carries the correlation
        # of the operation that dispatched it; the worker restores it around the handler.
        default_bus: messenger.bus.default
        buses:
            messenger.bus.default:
                middleware:
                    - App\Messenger\CorrelationMiddleware

        transports:
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            failed: "doctrine://default?queue_name=failed"
            sync: "sync://"

        routing:
            App\Message\SendTemplatedEmailMessage:          async
            App\Message\SendBillingEmailMessage:            async
            App\Message\PlanningDeployPdfsMessage:          async
            App\Message\PlanningAlertRaisedMessage:         async
            App\Message\MissionLifecycleChangedMessage:     async
            App\Message\AbsenceMissionsReactedMessage:      async
            App\Message\AbsenceImpactNotificationMessage:   async
            App\Message\MissionPublishedMessage:            async
            App\Message\CatalogueRequestProcessedMessage:   async
            App\Message\CatalogueRequestCreatedMessage:     async
            App\Message\AbsenceSelfDeclaredMessage:         async
            App\Message\SurgeonMissionRequestCreatedMessage: async
            App\Message\SurgeonMissionRequestDecidedMessage: async
            App\Message\EncodingAnomalyReportCreatedMessage: async
            App\Message\EncodingAnomalyReportResolvedMessage: async
            App\Message\MissionUncoveredEscalationMessage: async
            App\Message\PlanningRestoredAfterAbsenceMessage: async
            App\Message\AbsenceImpactSummaryMessage:         async
            App\Message\MissionHoursReminderMessage:         async
            App\Message\OpenMissionPoolMessage:              async
            App\Message\PlanningModificationAppliedMessage:  async
            App\Message\SurgeonEncodingChangedMessage:       async
            App\Message\ReleasedRoomSlotsCreatedMessage:     async
            App\Message\RoomTakeoverPriorityExpiryMessage:   async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
