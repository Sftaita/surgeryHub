security:
    # Hash des mots de passe
    password_hashers:
        App\Entity\User: "auto"
        # (Option alternative) si tu veux rester générique :
        # Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Provider (charge l'utilisateur via Doctrine par email)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Outils dev et assets
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # LOGIN JWT: capture /api/auth/login AVANT tout le reste
        login:
            pattern: ^/api/auth/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # D-140 — API machine-à-machine dédiée à MedVue (lecture des congés, dissociation).
        # AVANT le firewall `api` : un JWT utilisateur n'y est jamais accepté, et le secret
        # MedVue n'ouvre aucune autre route /api.
        medvue_integration:
            pattern: ^/api/integrations/medvue/
            stateless: true
            custom_authenticators:
                - App\Security\MedVueIntegration\MedVueIntegrationAuthenticator
            entry_point: App\Security\MedVueIntegration\MedVueIntegrationAuthenticator

        # D-157 — refresh et logout d'une session d'appareil : AUCUN authentificateur JWT ici.
        # Sur le firewall `api`, l'authentificateur JWT (priorité -10) passait avant
        # `refresh_jwt` (-50) : le jeton d'accès expiré que le client envoie encore faisait
        # répondre « Expired JWT Token » avant même la lecture du refresh token (déconnexion
        # à chaque expiration), et un logout ne révoquait rien. AuthSessionController lit le
        # seul refresh token du corps (DeviceSessionService).
        auth_session:
            pattern: ^/api/auth/(refresh|logout)$
            security: false

        # D-175 — routes du service worker (accusés de réception, pushsubscriptionchange) : appelées
        # sans session, chacune authentifiée par un jeton dédié (PushReceiptService,
        # PushDeviceRenewalService) et plafonnée globalement (PushDeviceController). AUCUN authentificateur JWT ici.
        push_device:
            pattern: ^/api/push/(receipts|device/renew)$
            security: false

        # API protégée par JWT
        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        # Firewall "site" (si tu ajoutes des pages non-API un jour)
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # Autoriser le préflight CORS (OPTIONS) partout sur /api
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }

        # Endpoints publics
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/invitations, roles: PUBLIC_ACCESS }
        - { path: ^/api/push/(receipts|device/renew)$, roles: PUBLIC_ACCESS }

        # D-140 — client machine MedVue uniquement
        - { path: ^/api/integrations/medvue/, roles: ROLE_MEDVUE_INTEGRATION }

        # Tout le reste de /api nécessite un JWT valide
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
