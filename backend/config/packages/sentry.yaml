sentry:
    dsn: '%env(SENTRY_DSN)%'
    register_error_listener: true
    options:
        environment: '%kernel.environment%'
        traces_sample_rate: 0.1
        # D-140 — jamais le code d'association MedVue ni le secret machine dans un rapport.
        before_send: 'App\Monitoring\SentryIntegrationSecretScrubber'
