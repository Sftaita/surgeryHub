# --- Frontend SPA: surgicalhub.be / www.surgicalhub.be -----------------------
# D-163 — règles de cache (auparavant aucune : cache heuristique du navigateur sur tout,
# y compris index.html, et un asset disparu renvoyait index.html en 200 « text/html ») :
#   - /assets/* : noms hashés par Vite (contenu immuable) → cache long ; un asset absent
#     (onglet ou PWA restés sur un ancien bundle après un déploiement) → 404, jamais du HTML
#     servi comme JavaScript : le frontend recharge alors la page (vite:preloadError) ;
#   - index.html, sw.js, manifest.json, icônes → `no-cache` : réutilisables, mais revalidés à
#     chaque chargement (ETag) — une nouvelle version est vue au rechargement suivant, et le
#     Service Worker (sw.js) est toujours comparé à la version du serveur.
# Aucune réponse de l'API n'est mise en cache ici (Symfony : `private`, /api/version `no-store`).
server {
    listen 80 default_server;
    server_name surgicalhub.be www.surgicalhub.be;

    root /var/www/frontend;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";   # pas « always » : un 404 ne doit jamais être mis en cache
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# --- API (Symfony): api.surgicalhub.be ---------------------------------------
server {
    listen 80;
    server_name api.surgicalhub.be;

    root /var/www/backend/public;
    index index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
