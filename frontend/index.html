<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Aligné sur le dégradé réel du header mobile (MobileLayout.tsx BrandBand :
      linear-gradient(140deg, #1F6B4F 0%, #338F6E 62%, #42A882 118%)) — #63C9A3
      (vert clair, ton "accent" du design system) ne correspondait à aucune des
      couleurs effectivement visibles dans ce dégradé (audit PWA/mobile/admin
      2026-07-29, Lot 4). #1F6B4F est le point de départ du dégradé (haut de
      l'écran), donc le plus représentatif pour la barre de statut Android/PWA.
    -->
    <meta name="theme-color" content="#1F6B4F" />
    <style>
      /* Empêche une bande blanche pendant le rebond de scroll iOS (overscroll) —
         fond aligné sur celui de l'app-shell (MUI CssBaseline palette.background.default,
         voir AppProviders.tsx), appliqué avant même le montage React puisque le rebond
         natif Safari est un rendu du navigateur, pas de la page (Lot 4). */
      html, body { background-color: #F5F7FA; overscroll-behavior-y: none; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SurgicalHub" />
    <!--
      icon-16-v2/icon-32-v2 (pas icon-16.png/icon-32.png) — ces deux fichiers
      contenaient encore l'ancien logo (croix bleue générique) alors que toutes
      les icônes PWA ≥72px avaient déjà été régénérées avec le nouveau logo le
      2026-07-29 (favicon audit, 2026-08-05). Nom de fichier différent (plutôt
      qu'un simple remplacement du contenu au même chemin) pour garantir que le
      cache favicon très persistant des navigateurs (souvent indépendant des
      en-têtes Cache-Control classiques) reparte sur une URL jamais vue.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SurgicalHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
